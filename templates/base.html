{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCorp Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800" style="min-height: 100vh; display: flex; flex-direction: column; {% if '/admin-dashboard/' in request.path %}
    background-image: linear-gradient(rgba(240, 244, 248, 0.9), rgba(240, 244, 248, 0.9)), url('https://images.unsplash.com/photo-1554774853-719586f82d77?auto=format&fit=crop&w=1920&q=80');
{% elif '/employee-dashboard/' in request.path %}
    background-image: linear-gradient(rgba(240, 244, 248, 0.9), rgba(240, 244, 248, 0.9)), url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=1920&q=80');
{% elif '/admin/task/' in request.path %}
    background-image: linear-gradient(rgba(240, 244, 248, 0.9), rgba(240, 244, 248, 0.9)), url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1920&q=80');
{% elif '/login/' in request.path %}
    background-image: linear-gradient(rgba(240, 244, 248, 0.8), rgba(240, 244, 248, 0.8)), url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80');
{% else %}
    background-image: linear-gradient(rgba(240, 244, 248, 0.95), rgba(240, 244, 248, 0.95)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1920&q=80');
{% endif %}
background-size: cover; background-position: center; background-attachment: fixed;">
    <nav class="bg-blue-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="flex items-center space-x-3 group">
                <img src="{% static 'images/logo.jpg' %}" alt="SecureCorp Logo" class="h-12 w-12 object-contain rounded-full shadow-lg border-2 border-blue-400 bg-white group-hover:border-white transition-colors">
                <span class="text-3xl tracking-widest text-blue-50 group-hover:text-white transition-colors" style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-variant: small-caps;">SecureCorp</span>
            </a>
            <div>
                {% if user.is_authenticated %}
                    <span class="mr-4">Hello, {{ user.username }} ({{ user.role }})</span>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4">
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 rounded {% if message.tags == 'success' %}bg-green-100 text-green-800{% elif message.tags == 'error' %}bg-red-100 text-red-800{% else %}bg-blue-100 text-blue-800{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
