{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-gray-200 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded mt-4 hover:bg-blue-700">Login</button>
    </form>
    <p class="mt-4 text-center text-gray-600">
        Don't have an account? <a href="{% url 'register' %}" class="text-blue-600 hover:underline">Register here</a>.
    </p>
</div>

<style>
    form p { margin-bottom: 1.25rem; }
    form label { display: block; font-weight: bold; margin-bottom: 0.5rem; color: #374151; }
    form input { 
        width: 100%; 
        border: 1px solid #d1d5db; 
        border-radius: 0.375rem; 
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
        padding-right: 0.75rem;
        padding-left: 1.5rem; /* Extra paddingLeft for typing field as requested */
        font-size: 1rem;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    form input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
</style>
{% endblock %}
