{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">Register New Account</h2>
    <form method="post" action="{% url 'register' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded mt-4 hover:bg-blue-700">
            Create Account
        </button>
    </form>
    <p class="mt-4 text-center text-gray-600">
        Already have an account? <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Log in here</a>.
    </p>
</div>
<style>
    /* basic styling for django form paragraphs */
    form p { margin-bottom: 1rem; }
    form label { display: block; font-weight: bold; margin-bottom: .25rem; color: #374151; }
    form input { width: 100%; border: 1px solid #d1d5db; border-radius: .25rem; padding: .5rem; }
    .helptext, .errorlist { font-size: 0.875rem; color: #6b7280; }
    .errorlist { color: #dc2626; }
</style>
{% endblock %}
